name: Release

# Publishing is tag-driven only: pushing a v* tag is the single trigger.
# master/main never publishes (see ci.yml).
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify-tag:
    name: verify tag matches version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print({p["name"]: p["version"] for p in d["packages"]}["radicom"])')
          echo "tag=$tag radicom=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match the radicom version $version"
            exit 1
          fi

  test:
    name: test before release
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  publish:
    name: publish to crates.io
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Dependency order: a crate can only be published after everything it
      # depends on exists on crates.io. xtask is publish = false.
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # The crates.io index needs a moment to expose a freshly published
          # crate; retry a few times before giving up on an index miss.
          publish() {
            local pkg="$1"
            for attempt in 1 2 3 4 5 6; do
              echo "::group::cargo publish $pkg (attempt $attempt)"
              if cargo publish -p "$pkg"; then
                echo "::endgroup::"
                echo "$pkg published"
                return 0
              fi
              echo "::endgroup::"
              echo "$pkg not publishable yet, retrying in 30s"
              sleep 30
            done
            echo "::error::failed to publish $pkg"
            return 1
          }

          publish radicom-dict
          publish radicom
          publish radicom-json
          publish radicom-network
