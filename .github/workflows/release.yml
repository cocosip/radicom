name: Release

# Publishing is tag-driven only: pushing a v* tag is the single trigger.
# master/main never publishes (see ci.yml). workflow_dispatch only regenerates
# the GitHub release notes for an existing tag; it never publishes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to generate release notes for (publishing is skipped)"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # workflow_dispatch supplies the tag explicitly; a tag push falls back to the
  # pushed ref. Jobs below read only this variable.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify-tag:
    name: verify tag matches version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag, the workspace version and every publishable crate must agree,
      # and the publishable set must match the list publish actually pushes, so
      # a crate added to the workspace can never be silently left unpublished.
      - name: Tag and crate set must match the workspace version
        run: |
          tag="${RELEASE_TAG#v}"
          cargo metadata --format-version 1 --no-deps > meta.json
          python3 - "$tag" <<'PY'
          import json, sys

          tag = sys.argv[1]
          packages = json.load(open("meta.json"))["packages"]
          publishable = {p["name"]: p["version"] for p in packages if p.get("publish") is None}
          expected = {"radicom-dict", "radicom", "radicom-json", "radicom-network"}

          problems = []
          if set(publishable) != expected:
              problems.append(
                  f"publishable crates {sorted(publishable)} != {sorted(expected)}; "
                  "update the publish list in release.yml"
              )
          for name, version in sorted(publishable.items()):
              print(f"{name}={version}")
              if version != tag:
                  problems.append(f"{name} is {version}, but the tag is v{tag}")
          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)
          print(f"tag v{tag} matches all {len(publishable)} publishable crates")
          PY

  test:
    name: checks before release
    if: github.event_name == 'push'
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      # Every gate ci.yml enforces, plus the default-feature build that users
      # get from `cargo add`: a tag must not publish what CI would reject.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Test (default features)
        run: cargo test --workspace

      - name: Test (all features)
        run: cargo test --workspace --all-features

      - name: Docs
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Generated dictionary is up to date
        run: cargo run --package xtask -- gen-dict --check

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Production line coverage (90% floor)
        run: cargo run --package xtask -- coverage

      # `--list` only: before the first release the dependents' own path deps
      # are not on crates.io yet, so `cargo package` cannot resolve them; the
      # ordered publish below covers their full build. This still proves the
      # metadata and the shipped file set.
      - name: Publishable metadata and shipped files
        run: |
          for pkg in radicom-dict radicom radicom-json radicom-network; do
            echo "::group::$pkg"
            files=$(cargo package -p "$pkg" --list | tr -d '\r')
            printf '%s\n' "$files"
            for f in LICENSE README.md; do
              if ! printf '%s\n' "$files" | grep -qx "$f"; then
                echo "::error::$pkg does not package $f"
                exit 1
              fi
            done
            echo "::endgroup::"
          done

  msrv:
    name: msrv (1.89)
    if: github.event_name == 'push'
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-features

  publish:
    name: publish to crates.io and write release notes
    needs: [test, msrv]
    # A skipped need would skip this job too, which is why workflow_dispatch
    # needs an explicit override; and the checks stay authoritative because
    # publishing requires both of them to have succeeded. `!cancelled()`
    # replaces `always()` so a cancelled run can never start publishing.
    if: "!cancelled() && (github.event_name == 'workflow_dispatch' || (needs.test.result == 'success' && needs.msrv.result == 'success'))"
    runs-on: ubuntu-latest
    # The default token is read-only; writing the GitHub release needs write.
    permissions:
      contents: write
    steps:
      # Full history and every tag: the notes are built from the commit range
      # between this tag and the previous one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Dependency order: a crate is publishable only after everything it
      # depends on exists on crates.io. xtask is publish = false.
      - name: Publish crates in dependency order
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"

          # A failed tag release is re-run from the same tag, so versions that
          # already reached crates.io must be skipped rather than retried:
          # cargo publish refuses to overwrite an existing version.
          published() {
            curl -fsS -H "User-Agent: radicom-release-ci (https://github.com/cocosip/radicom)" \
              "https://crates.io/api/v1/crates/$1/$2" >/dev/null
          }

          # The crates.io index needs a moment to expose a freshly published
          # crate; retry a few times before giving up on an index miss.
          publish() {
            local pkg="$1"
            for attempt in 1 2 3 4 5 6; do
              echo "::group::cargo publish $pkg (attempt $attempt)"
              if cargo publish -p "$pkg"; then
                echo "::endgroup::"
                echo "$pkg published"
                return 0
              fi
              echo "::endgroup::"
              echo "$pkg not publishable yet, retrying in 30s"
              sleep 30
            done
            echo "::error::failed to publish $pkg"
            return 1
          }

          for pkg in radicom-dict radicom radicom-json radicom-network; do
            if published "$pkg" "$version"; then
              echo "$pkg $version is already on crates.io, skipping"
            else
              publish "$pkg"
            fi
          done

      # Release notes carry the version's change set: every non-merge commit
      # subject since the previous tag, plus a compare link. On the first
      # release there is no previous tag, so the whole history is listed.
      # workflow_dispatch reaches this step only, which is how notes are
      # backfilled for a tag that was published before this job existed.
      - name: Generate release notes from commits
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if ! git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::tag $tag is not in this repository"
            exit 1
          fi
          prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          {
            echo "## What's Changed"
            echo ""
            if [ -n "$prev" ]; then
              git log "${prev}..${tag}" --pretty=tformat:"- %s" --no-merges
            else
              git log "${tag}" --pretty=tformat:"- %s" --no-merges
            fi
            echo ""
            echo "**Crates published**: \`radicom-dict\`, \`radicom\`, \`radicom-json\`, \`radicom-network\` at \`${tag#v}\`."
            if [ -n "$prev" ]; then
              echo ""
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${prev}...${tag}"
            fi
          } > CHANGELOG_BODY.md
          echo "::group::release notes"
          cat CHANGELOG_BODY.md
          echo "::endgroup::"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: CHANGELOG_BODY.md
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
