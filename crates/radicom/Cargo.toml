[package]
name = "radicom"
description = "DICOM processing library: data model, file IO, pixel data facade, codec interfaces and transcoder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
radicom-dict = { path = "../radicom-dict", version = "0.1.0" }
bytes.workspace = true
thiserror.workspace = true
once_cell.workspace = true
chrono.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
quick-xml.workspace = true
regex = { workspace = true, optional = true }
uuid.workspace = true
tracing.workspace = true

[features]
default = []
render = []
# `anonymize` also gates the `Regex` variants of `rules::{MatchRule, TransformRule}`
# (crates/radicom/src/rules/), which are the only users of `regex` — the anonymizer
# itself has none (its profile matcher is the hand-rolled subset in
# anonymizer/profile.rs, review §3.6). Decoupling them needs the `regex-rules`
# cfg in rules/, so the two remain coupled for now.
anonymize = ["dep:regex"]

[dev-dependencies]
rayon.workspace = true
tracing-core = { version = "0.1", default-features = false }

[[bench]]
name = "core"
harness = false
