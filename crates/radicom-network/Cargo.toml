[package]
name = "radicom-network"
description = "DICOM network communication (DIMSE): associations, services, SCU and SCP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
radicom = { path = "../radicom", version = "0.1.0" }
bytes.workspace = true
thiserror.workspace = true
once_cell.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio-rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
# SO_SNDBUF/SO_RCVBUF: tokio exposes no setter, socket2 reaches the same
# descriptor (already in the graph as a tokio dependency)
socket2 = "0.6"

[features]
default = []
tls = ["dep:tokio-rustls", "dep:rustls-pemfile"]
# OBS-02: TracingMetrics emits fo-dicom-aligned metrics via `tracing` field
# conventions (no `opentelemetry` dependency; downstream bridges to OTel).
otel = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rcgen = "0.13"

[[bench]]
name = "throughput"
harness = false
