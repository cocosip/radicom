[workspace]
resolver = "3"
members = [
    "crates/radicom",
    "crates/radicom-dict",
    "crates/radicom-network",
    "crates/radicom-json",
    "xtask",
]

[workspace.package]
# Single source of truth for the workspace version: members inherit it, and the
# internal pins under [workspace.dependencies] repeat it because a packaged path
# dependency must carry a literal version. A release bump edits those literals
# together in this file; cargo fails the build when they disagree.
version = "0.1.2"
edition = "2021"
rust-version = "1.89"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/cocosip/radicom"

[workspace.dependencies]
# Internal crates: one path + version pair for the whole graph. Cargo rejects a
# mismatch between these pins and the members' versions, so a stale bump fails
# every build instead of failing halfway through a publish.
radicom = { path = "crates/radicom", version = "0.1.2" }
radicom-dict = { path = "crates/radicom-dict", version = "0.1.2" }
radicom-json = { path = "crates/radicom-json", version = "0.1.2" }
radicom-network = { path = "crates/radicom-network", version = "0.1.2" }

bytes = "1"
thiserror = "2"
once_cell = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
encoding_rs = "0.8"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "time", "sync", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tracing = "0.1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
rayon = "1"
quick-xml = "0.37"
futures = "0.3"
async-trait = "0.1"

[profile.bench]
debug = true
