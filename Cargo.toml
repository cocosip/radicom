[workspace]
resolver = "2"
members = [
    "crates/radicom",
    "crates/radicom-dict",
    "crates/radicom-network",
    "crates/radicom-json",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/cocosip/radicom"
authors = ["radicom contributors"]

[workspace.dependencies]
bytes = "1"
thiserror = "2"
once_cell = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
encoding_rs = "0.8"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "time", "sync", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tracing = "0.1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
rayon = "1"
quick-xml = "0.37"
futures = "0.3"
async-trait = "0.1"

[profile.bench]
debug = true
